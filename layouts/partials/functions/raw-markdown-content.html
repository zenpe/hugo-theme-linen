{{- $raw := . | default "" | replaceRE "\r\n?" "\n" -}}
<figure class="highlight">
  <table><tbody><tr><td class="code"><pre>{{- range split (strings.TrimRight "\n" $raw) "\n" -}}<span class="line">{{ . | htmlEscape | safeHTML }}</span>
{{- end -}}</pre></td></tr></tbody></table>
  <div class="copy-btn"></div>
</figure>
